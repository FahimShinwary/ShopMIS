name: Build Electron Windows Exe

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Windows Build Tools & MSVS 2022
        run: |
          npm config set msvs_version 2022 --global
        shell: bash

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        env:
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      - name: Rebuild Native Modules for Electron 29
        run: npx electron-builder install-app-deps
        env:
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      - name: Build Web Assets & Electron Bundle
        run: npm run build

      - name: Package Windows EXE Installer
        run: npx electron-builder --win --x64 -c.npmRebuild=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      - name: Create / Update GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Shop MIS Windows Installer
          body: |
            ## Shop MIS Desktop Installer for Windows
            - Download `Shop MIS Setup 1.0.0.exe` below.
          draft: false
          prerelease: false
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
